### EvoMaster configuration for the Vovage backend.
### Full option list: https://github.com/WebFuzzing/EvoMaster/blob/master/docs/options.md

configs:
  blackBox: true
  problemType: "REST"
  base: "http://127.0.0.1:6050"
  schema: "openapi.json"
  outputFormat: "PYTHON_UNITTEST"
  outputFolder: "generated_tests"
  outputFilePrefix: "EvoMaster"
  outputFileSuffix: "Test"
  maxTime: "120s"
  ratePerMinute: 0
  testTimeout: 30
  writeStatistics: true
  statisticsFile: "statistics.csv"
  endpointExclude: "/api/analysis/scan,/api/structure/files"
