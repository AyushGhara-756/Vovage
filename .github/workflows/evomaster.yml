name: EvoMaster API fuzzing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      max_time:
        description: "EvoMaster search budget (for example 60s, 120s, 5m)"
        required: false
        default: "120s"
        type: string

permissions:
  contents: read

concurrency:
  group: evomaster-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  EVOMASTER_VERSION: "6.2.0"
  NOIR_VERSION: "1.5.0"
  MAX_TIME: ${{ inputs.max_time || '120s' }}

jobs:
  evomaster:
    name: Fuzz the Flask API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Cache EvoMaster runtime
        uses: actions/cache@v4
        with:
          path: ~/.evomaster
          key: evomaster-${{ runner.os }}-${{ env.EVOMASTER_VERSION }}

      - name: Prepare EvoMaster runtime
        run: evomaster --help > /dev/null

      - name: Install Noir
        run: |
          curl -fsSL -o /tmp/noir \
            "https://github.com/owasp-noir/noir/releases/download/v${NOIR_VERSION}/noir-v${NOIR_VERSION}-linux-x86_64"
          sudo install -m 0755 /tmp/noir /usr/local/bin/noir
          noir version

      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -v

      - name: Run EvoMaster pipeline
        run: bash scripts/run_evomaster.sh

      - name: Summarize EvoMaster results
        if: always()
        run: python scripts/summarize_evomaster.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EvoMaster artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evomaster-results-${{ github.run_id }}
          path: |
            generated_tests/
            process_data/
            statistics.csv
            openapi.json
            evomaster.log
            backend.log
            noir.log
          if-no-files-found: warn
          retention-days: 14
